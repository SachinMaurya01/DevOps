# Starts LocalStack on http://localhost:4566
#   docker compose up -d
#
# Notes:
# - If you already have a LocalStack container running (e.g. `localstack-aws`
#   on 127.0.0.1:4566), reuse it instead of starting a second one.
#   Check with: curl -s http://localhost:4566/_localstack/health
# - If your LocalStack version asks for an auth token, create a free account at
#   localstack.cloud and export LOCALSTACK_AUTH_TOKEN before starting.
services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      # Unset SERVICES to enable all emulated services (simplest for learning).
      # If startup is slow, restrict to what this project uses:
      # ec2,s3,sqs,lambda,iam,logs,cloudwatch,cloudfront,sts
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - "./.localstack:/var/lib/localstack"
      # Lambda runs inside Docker containers, so LocalStack needs the socket.
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
